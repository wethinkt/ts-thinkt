version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
    groups:
      dev-dependencies:
        patterns:
          - '@eslint/*'
          - '@typescript-eslint/*'
          - 'eslint'
          - 'typescript-eslint'
          - 'typescript'
          - 'openapi-typescript'
          - 'swagger2openapi'
      # Keep vitest packages together - they must be updated as a unit
      vitest:
        patterns:
          - 'vitest'
          - '@vitest/*'
    ignore:
      # Ignore major version updates for vitest ecosystem (manual update required)
      - dependency-name: 'vitest'
        update-types: ['version-update:semver-major']
      - dependency-name: '@vitest/*'
        update-types: ['version-update:semver-major']
